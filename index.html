<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Sistema de Vendas para Gráficas</title>

    <!-- Global error and CORS/Script Error diagnostics with automatic self-healing and browser extension safety -->
    <script>
      // Protege window.fetch contra extensões de navegador que tentam reatribuir fetch em objetos com apenas getter
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            get: function() { return _origFetch; },
            set: function(v) { _origFetch = v; }
          });
        }
      } catch (e) {}

      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var url = event.filename || '';
        
        // Ignora erros originados de extensões de navegador
        if (url && (url.indexOf('chrome-extension://') > -1 || url.indexOf('moz-extension://') > -1)) {
          return;
        }

        var err = event.error;
        var isResourceError = event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK');
        
        // Detecta falhas críticas de carregamento de scripts que causem tela branca
        var isSyntaxError = msg.indexOf('SyntaxError') > -1 || (err && err.name === 'SyntaxError');
        var isChunkLoadFailed = msg.toLowerCase().indexOf('failed to fetch dynamically imported module') > -1 || msg.toLowerCase().indexOf('error loading dynamically imported module') > -1;
        
        // Só ativa auto-recuperação para falhas de carregamento de recursos próprios e erros de sintaxe (cache quebrado)
        if (isChunkLoadFailed || isSyntaxError) {
          console.log('[Self-Healing] Erro crítico detectado. Verificando necessidade de recarregamento...');

          var now = Date.now();
          var lastReload = Number(sessionStorage.getItem('NUCLEO_LAST_AUTO_RELOAD') || 0);
          var reloadCount = Number(sessionStorage.getItem('NUCLEO_AUTO_RELOAD_COUNT') || 0);

          if (now - lastReload < 20000) {
            if (reloadCount >= 2) {
              console.warn('[Self-Healing] Limite de recarregamento atingido.');
              return;
            }
            sessionStorage.setItem('NUCLEO_AUTO_RELOAD_COUNT', reloadCount + 1);
          } else {
            sessionStorage.setItem('NUCLEO_AUTO_RELOAD_COUNT', 1);
          }
          sessionStorage.setItem('NUCLEO_LAST_AUTO_RELOAD', now);

          setTimeout(function() {
            window.location.reload();
          }, 2000);
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var reasonStr = String(reason && reason.message ? reason.message : reason);
        if (reasonStr.includes('WebSocket') || reasonStr.includes('chrome-extension')) {
          return;
        }
        console.warn('[Diagnóstico Global] Rejeição interceptada:', reason);
      });
    </script>

    <!-- PWA Integration assets -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="theme-color" content="#4e1617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
